{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 450px; margin-top: 50px;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Obnovenie hesla</h2>
        <p style="color: #666; margin-bottom: 1.5rem; text-align: center; line-height: 1.5;">
            Zadajte svoj email a my vám pošleme odkaz na nastavenie nového hesla.
        </p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-row">
                <label for="id_email">Váš zaregistrovaný Email:</label>
                <input type="email" name="email" id="id_email" class="form-control" required placeholder="priklad@email.com">
            </div>

            <!-- Tlačidlá vedľa seba -->
            <div class="login-actions" style="margin-top: 25px;">
                <button class="btn btn-primary" type="submit">Poslať link</button>
                <a href="{% url 'users:login' %}" class="btn btn-outline" style="text-decoration: none;">
                    Späť
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
