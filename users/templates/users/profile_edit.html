{% extends 'base.html' %}
{% block title %}Úprava profilu{% endblock %}
{% block content %}
<div class="container" style="max-width: 700px; margin: 50px auto;">
  <div class="card">
    <h2>Úprava profilu</h2>
    <form method="post">
      {% csrf_token %}
      <div class="form-row" style="margin-bottom:.8rem;">
        <label for="id_username">Používateľské meno (nickname):</label>
        {{ form.username }}
      </div>
      <div class="form-row" style="margin-bottom:.8rem;">
        <label for="id_first_name">Meno:</label>
        {{ form.first_name }}
      </div>
      <div class="form-row" style="margin-bottom:.8rem;">
        <label for="id_last_name">Priezvisko:</label>
        {{ form.last_name }}
      </div>
      <div class="form-row" style="margin-bottom:1rem;">
        <label for="id_email">Email:</label>
        {{ form.email }}
      </div>
      <div style="display:flex; gap:.5rem; margin-top: 16px;">
        <button class="btn btn-primary" type="submit">Uložiť</button>
        <a class="btn btn-outline" href="{% url 'users:profile' %}">Späť</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/validation.js' %}"></script>
{% endblock %}
