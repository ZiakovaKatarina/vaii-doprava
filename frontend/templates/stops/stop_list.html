{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container" style="margin-top:30px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
    <h2>Zoznam zastávok</h2>
    {% if user.is_staff %}
      <a href="{% url 'frontend:stop_create' %}" class="btn btn-primary">+ Pridať zastávku</a>
    {% endif %}
  </div>

  <div style="display: flex; gap: 20px; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap;">
    <div style="flex: 0 1 250px;">
      <label>Hľadať:</label>
      <input type="text" id="stops-search" placeholder="Názov zastávky..." style="padding:8px; width:100%; margin:0;">
    </div>

    <div style="flex: 0 1 200px;">
      <label>Záznamov na stránku:</label>
      <select id="stops-page-size" style="padding:6px; width:100%; max-width: 150px;">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
    </div>

    <div style="margin-bottom: 8px; color: #666; font-weight: 600;">
      Celkom: <span id="stops-total-count">0</span> zastávok
    </div>
  </div>

  <table class="table" id="stops-main-table" data-is-staff="{{ user.is_staff|yesno:'true,false' }}">
    <thead>
      <tr>
        <th>Názov</th>
        <th>Zemepisná šírka</th>
        <th>Zemepisná dĺžka</th>
        {% if user.is_staff %}
          <th style="text-align:center;">Akcie</th>
        {% endif %}
      </tr>
    </thead>
    <tbody id="stops-tbody">
    </tbody>
  </table>

  <!-- Paginácia s lepším rozložením -->
  <div id="stops-pagination-container" style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 50px; margin-bottom: 50px; padding-top: 20px; border-top: 1px solid #eee;">
    
    <!-- Ľavý stĺpec pre tlačidlo Predošlá -->
    <div style="text-align: left;">
        <button id="stops-prev" class="btn btn-outline" style="display:none; width: auto;">← Predchádzajúca</button>
    </div>

    <!-- Stredný stĺpec pre info o strane -->
    <div style="text-align: center; min-width: 150px;">
        <span id="stops-page-info" style="font-weight: 600; font-size: 1.1rem; color: #333;">Strana ...</span>
    </div>

    <!-- Pravý stĺpec pre tlačidlo Ďalšia -->
    <div style="text-align: right;">
        <button id="stops-next" class="btn btn-outline" style="display:none; width: auto;">Nasledujúca →</button>
    </div>
  </div>
</div>

<script src="{% static 'js/stops-table.js' %}"></script>
{% endblock %}
