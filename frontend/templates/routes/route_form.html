{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>{{ title }}</h2>

    <form method="POST" id="route-form" novalidate>
        {% csrf_token %}

        {% for field in form %}
            <div class="form-row" style="margin-bottom: 1rem;">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                
                <div class="alert alert-error" style="display:none; color:red; font-size:0.9rem;"></div>
                
                {% if field.errors %}
                    <div class="alert alert-error" style="color:red; font-size:0.9rem; display:block;">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <button class="btn btn-primary" type="submit">Uložiť</button>
        <a class="btn btn-outline" href="{% url 'route_list' %}">Späť na zoznam</a>
    </form>
</div>
{% endblock %}
