{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>{{ title }}</h2>

    <form method="POST" id="route-form" novalidate>
        {% csrf_token %}

        {% for field in form %}
            <div class="form-row" style="margin-bottom: 1rem;">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                
                <div class="alert alert-error" style="display:none; color:red; font-size:0.9rem;"></div>
                
                {% if field.errors %}
                    <div class="alert alert-error" style="color:red; font-size:0.9rem; display:block;">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <button class="btn btn-primary" type="submit">Uložiť</button>
        <a class="btn btn-outline" href="{% url 'frontend:route_list' %}">Späť na zoznam</a>
    </form>
</div>

<script>
    const regexRoute = /^[a-zA-Z0-9áäčďéíľĺňóôŕšťúýžÁÄČĎÉÍĽĹŇÓÔŔŠŤÚÝŽ\s-]{2,}$/;
    
    const nameInput = document.querySelector('input[name="name"]');
    nameInput && nameInput.addEventListener('input', function() {
        const name = this.value.trim();
        const errorDiv = this.parentElement.querySelector('.alert.alert-error');
        
        if (name.length > 0 && !regexRoute.test(name)) {
            this.classList.add('error');
            if (errorDiv) errorDiv.style.display = 'block';
        } else {
            this.classList.remove('error');
            if (errorDiv) errorDiv.style.display = 'none';
        }
    });
</script>
{% endblock %}
