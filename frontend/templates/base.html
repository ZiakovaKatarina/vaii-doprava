<body>

    <header>
        <div class="container">
            <h1>Verejná Doprava</h1>
            <nav>
                <a href="{% url 'home' %}">Hľadanie Trasy</a>

                <div class="dropdown">
                    <span class="nav-link">Data</span>
                    <div class="dropdown-content">
                        <a style="color: black;" href="{% url 'stop_list' %}">Zastávky</a>
                        <a style="color: black;" href="{% url 'trip_list' %}">Spoje</a>
                        <a style="color: black;" href="{% url 'route_list' %}">Linky</a>
                        <a style="color: black;" href="{% url 'vehicle_list' %}">Vozidlá</a>
                    </div>
                </div>

                <div class="dropdown">
                    <span class="nav-link">Aministrativa</span>
                    <div class="dropdown-content">
                        <a style="color: black;" href="/admin/">Admin</a>
                        <a style="color: black;" href="{% url 'file_upload' %}">File upload</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <div class="container text-center">
            <p>2025 VAII – Semestrálna práca</p>
            <p>Katarína Žiaková</p>
        </div>
    </footer>

    <script>
document.addEventListener('DOMContentLoaded', function () {
    const dropdown = document.getElementById('admin-dropdown');
    const toggle = document.getElementById('admin-toggle');

    // Pre mobile: toggle triedy .active a aria-expanded
    function toggleDropdown() {
        const isActive = dropdown.classList.toggle('active');
        dropdown.classList.toggle('open', isActive);
        toggle.setAttribute('aria-expanded', isActive ? 'true' : 'false');
    }

    toggle.addEventListener('click', function(e){
        // vždy sprav toggle (desktop hover zostáva funkčný)
        toggleDropdown();
    });

    // zatvorenie klikom mimo
    document.addEventListener('click', function(e){
        if (!dropdown.contains(e.target)) {
            dropdown.classList.remove('active', 'open');
            toggle.setAttribute('aria-expanded', 'false');
        }
    });

    // klávesnica
    toggle.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleDropdown();
        } else if (e.key === 'Escape') {
            dropdown.classList.remove('active','open');
            toggle.setAttribute('aria-expanded','false');
            toggle.focus();
        }
    });
});
</script>

    {% block extra_js %}{% endblock %}
</body>
</html>
