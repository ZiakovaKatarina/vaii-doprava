{% extends "base.html" %}

{% block content %}

<div class="card">
    
    <h2 style="padding-bottom: 10px;">Import dát do systému</h2>
    
    <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="{% url 'frontend:csv_upload' %}" class="btn btn-primary" style="width: auto; flex-grow: 1; text-decoration: none; text-align: center; max-width: 300px;">
            📁 Importovať zastávky z CSV
        </a>
    </div>
    
    <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px;">
        <h3 style="margin-top: 0;">Ako importovať data?</h3>
        <p>Pomocou CSV importu môžete hromadne pridať zastávky do systému.</p>
        <p><strong>Formát CSV súboru:</strong></p>
        <pre style="background: white; padding: 10px; border-radius: 3px;">nazov,latitude,longitude
Zilina-Mesto,49.223,18.740
Uniza,49.202,18.761</pre>
    </div>
        
</div>

{% endblock %}
