{% extends "base.html" %}

{% block content %}

<div class="card" style="max-width: 800px; margin: 0 auto;">
    
    <h2 style="padding-bottom: 10px; border-bottom: 1px solid #eee; margin-bottom: 20px;">
        Centrum pre import dát
    </h2>
    
    <p style="margin-bottom: 20px; color: #666;">
        Vyberte typ údajov, ktoré chcete hromadne nahrať do systému.
    </p>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
        <div style="border: 1px solid #ddd; border-radius: 8px; padding: 20px; text-align: center; transition: transform 0.2s;">
            <div style="font-size: 2rem; margin-bottom: 10px;">🚏</div>
            <h3 style="margin-bottom: 10px;">Zastávky</h3>
            <p style="font-size: 0.9rem; color: #777; margin-bottom: 15px;">
                Import nových zastávok zo súboru CSV.
            </p>
            <a href="{% url 'frontend:csv_upload' %}" class="btn btn-primary" style="width: 100%;">
                Prejsť na import
            </a>
        </div>
    </div>
        
</div>

{% endblock %}
