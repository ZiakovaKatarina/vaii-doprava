{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
    <h2>Odstrániť vozidlo?</h2>
    
    <p style="margin: 1.5rem 0;">
        Naozaj chcete zmazať vozidlo <strong>{{ vehicle.registration_number }}</strong> ({{ vehicle.model_name }})?
    </p>
    
    <div class="alert alert-error">
        Pozor: Táto akcia je nevratná!
    </div>
    
    <form method="POST" style="margin-top: 1.5rem; display: flex; gap: 1rem;">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary" style="background-color: #dc3545; flex: 1;">
            Áno, zmazať
        </button>
        <a href="{% url 'vehicle_list' %}" class="btn btn-outline" style="flex: 1;">
            Zrušiť
        </a>
    </form>
</div>
{% endblock %}
