{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>{{ title }}</h2>

    <form method="POST" id="vehicle-form" novalidate>
        {% csrf_token %}

        {% for field in form %}
            <div class="form-row">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                
                <div class="alert alert-error js-error-msg" style="display:none; margin-top: 0.3rem; font-size: 0.85rem;"></div>
                
                {% if field.errors %}
                    <div class="alert alert-error" style="display:block; margin-top: 0.3rem;">
                        {{ field.errors.0 }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
            <button class="btn btn-primary" type="submit" style="flex: 1;">Uložiť vozidlo</button>
            <a class="btn btn-outline" href="{% url 'frontend:vehicle_list' %}" style="flex: 1; text-align: center;">Späť</a>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('vehicle-form');
    const regInput = document.querySelector('input[name="registration_number"]');
    const regexSPZ = /^[A-Z]{2}-?[0-9]{3}[A-Z]{2}$|^[A-Z0-9-]{4,10}$/;

    function validateSPZ() {
        const val = regInput.value.toUpperCase().trim();
        const errorDiv = regInput.parentElement.querySelector('.js-error-msg');

        if (val.length > 0 && !regexSPZ.test(val)) {
            regInput.setCustomValidity("Invalid");
            errorDiv.textContent = "Zadajte platný formát ŠPZ (napr. ZA-123AB).";
            errorDiv.style.display = "block";
            regInput.style.borderColor = "red";
        } else {
            regInput.setCustomValidity("");
            errorDiv.style.display = "none";
            regInput.style.borderColor = "";
        }
    }

    if (regInput) {
        regInput.addEventListener('input', validateSPZ);
    }

    form.addEventListener('submit', function(e) {
        validateSPZ();
        if (!form.checkValidity()) {
            e.preventDefault();
            form.reportValidity();
        }
    });
});
</script>
{% endblock %}
