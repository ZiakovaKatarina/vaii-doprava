{% extends "base.html" %}
{% block content %}
<div class="card center">
    <h2>Zmazať spoj</h2>
    <p>Skutočne chceš zmazať <strong>{{ trip }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Áno, zmazať</button>
        <a href="{% url 'frontend:trip_list' %}" class="btn btn-outline">Nie, späť</a>
    </form>
</div>
{% endblock %}
